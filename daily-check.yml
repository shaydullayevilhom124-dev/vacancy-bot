name: Kunlik vakansiya tekshiruvi

on:
  schedule:
    # Har kuni ertalab soat 08:00 (Toshkent, UTC+5) = 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {} # qo'lda ham ishga tushirish mumkin bo'lishi uchun

permissions:
  contents: write

jobs:
  check-vacancies:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bog'liqliklarni o'rnatish
        run: npm install

      - name: Skriptni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scraper.js

      - name: Yangi holatni saqlash (commit)
        run: |
          git config user.name "vacancy-bot"
          git config user.email "actions@github.com"
          git add state/seen.json
          git diff --staged --quiet || git commit -m "Holatni yangilash: $(date -u +'%Y-%m-%d')"
          git push
